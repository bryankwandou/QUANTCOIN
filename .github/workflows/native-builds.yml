name: native builds

on:
  push:
    paths: ['apps/native/**', '.github/workflows/native-builds.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/native

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze lib
      # Offline tests only; the devnet send tests need keys that never leave the dev machine.
      - run: flutter test --exclude-tags devnet-send

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      # Unsigned: proves the app compiles and links for iOS. Signing needs an Apple developer account.
      - run: flutter build ios --release --no-codesign
      - run: cd build/ios/iphoneos && zip -qr ../../../quantum-safe-ios-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with: { name: ios-unsigned, path: apps/native/quantum-safe-ios-unsigned.zip }

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build macos --release
      - run: cd build/macos/Build/Products/Release && ditto -c -k --keepParent *.app ../../../../../quantum-safe-macos.zip
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: apps/native/quantum-safe-macos.zip }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create --platforms=windows --org dev.quantcoin .
      - run: flutter pub get
      # local_auth_windows still includes <experimental/coroutine>, which MSVC 14.5x rejects by default.
      - run: flutter build windows --release
        env: { CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS }
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: apps/native/build/windows/x64/runner/Release/ }
