name: app launch smoke

# Launches every released Quantum Safe build on a real OS and screenshots it.
# Android, Windows and macOS use the exact files from the GitHub release, checked
# against SHA256SUMS.txt first. The unsigned iOS .ipa is an arm64 device build and
# cannot run in a simulator, so the iOS job builds the same commit for the simulator.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to test
        default: app-v0.1.0

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || 'app-v0.1.0' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify the release APK
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p QuantumSafe-android.apk -p SHA256SUMS.txt
          grep ' QuantumSafe-android.apk$' SHA256SUMS.txt | sha256sum -c - | tee verify.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r QuantumSafe-android.apk
            adb shell monkey -p app.quantumsafe.quantum_safe -c android.intent.category.LAUNCHER 1
            sleep 25
            adb shell pidof app.quantumsafe.quantum_safe | tee pid.txt
            test -s pid.txt
            adb exec-out screencap -p > android.png
            adb logcat -d -s flutter AndroidRuntime:E > logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-android
          path: |
            verify.txt
            pid.txt
            android.png
            logcat.txt

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download and verify the release zip
        run: |
          gh release download "$env:TAG" -R "$env:GITHUB_REPOSITORY" -p QuantumSafe-windows-x64.zip -p SHA256SUMS.txt
          $want = (Select-String -Path SHA256SUMS.txt -Pattern ' QuantumSafe-windows-x64.zip$').Line.Split(' ')[0]
          $got = (Get-FileHash QuantumSafe-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "want $want`ngot  $got" | Tee-Object verify.txt
          if ($want -ne $got) { throw "checksum mismatch" }
      - name: Launch and screenshot
        run: |
          Expand-Archive QuantumSafe-windows-x64.zip app
          $p = Start-Process app/quantum_safe.exe -PassThru
          Start-Sleep 25
          $p.Refresh()
          "alive=$(-not $p.HasExited) title=$($p.MainWindowTitle)" | Tee-Object proc.txt
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object Drawing.Bitmap $b.Width, $b.Height
          [Drawing.Graphics]::FromImage($bmp).CopyFromScreen(0, 0, 0, 0, $bmp.Size)
          $bmp.Save("$pwd/windows.png")
          if ($p.HasExited) { throw "app exited" }
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-windows
          path: |
            verify.txt
            proc.txt
            windows.png

  macos:
    runs-on: macos-latest
    steps:
      - name: Download and verify the release zip
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p QuantumSafe-macos.zip -p SHA256SUMS.txt
          grep ' QuantumSafe-macos.zip$' SHA256SUMS.txt | shasum -a 256 -c - | tee verify.txt
      - name: Launch and screenshot
        run: |
          ditto -x -k QuantumSafe-macos.zip app
          APP=$(ls -d app/*.app | head -1)
          xattr -cr "$APP"
          open "$APP"
          sleep 25
          pgrep -fl quantum_safe | tee pid.txt
          test -s pid.txt
          screencapture -x macos.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-macos
          path: |
            verify.txt
            pid.txt
            macos.png

  ios-simulator:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator
      - name: Boot a simulator, install, launch, screenshot
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "simulator $UDID" | tee sim.txt
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$UDID" app.quantumsafe.quantumSafe | tee -a sim.txt
          sleep 25
          xcrun simctl spawn "$UDID" launchctl list | grep -i quantumsafe | tee -a sim.txt
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/ios-simulator.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-ios-simulator
          path: |
            apps/native/sim.txt
            ios-simulator.png
